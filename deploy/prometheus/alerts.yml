groups:
  - name: support-agent
    rules:
      - alert: AgentHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 5% of API requests are failing"
      - alert: AgentLLMFailures
        expr: sum(rate(agent_llm_requests_total{status="error"}[5m])) > 0.1
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "LLM provider is returning errors"
      - alert: AgentSlowTurns
        expr: histogram_quantile(0.95, sum(rate(agent_turn_duration_seconds_bucket[10m])) by (le)) > 10
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "p95 agent turn latency above 10s"
      - alert: AgentKnowledgeGaps
        expr: sum(rate(agent_rag_hits_bucket{le="0"}[1h])) / clamp_min(sum(rate(agent_rag_hits_count[1h])), 1e-9) > 0.3
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over 30% of searches find no relevant documentation - review the knowledge base"
      - alert: AgentEscalationSpike
        expr: sum(increase(agent_escalations_total[15m])) > 20
        labels: { severity: warn }
        annotations:
          summary: "Unusual number of human escalations in 15 minutes"
